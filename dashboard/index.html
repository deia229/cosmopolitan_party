<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmopolitan Party Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f4f6;
    }
    
    .header {
      background: linear-gradient(135deg, #ec4899, #db2777);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    
    .header p {
      font-size: 18px;
      opacity: 0.9;
    }
    
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin: 20px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .card h2 {
      color: #1f2937;
      margin-bottom: 15px;
    }
    
    .card p {
      color: #6b7280;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎉 Cosmopolitan Party</h1>
    <p>Dashboard CRM - Gestão de Eventos</p>
  </div>
  
  <div class="container">
    <div class="card">
      <h2>Bem-vinda, Andreia!</h2>
      <p>Sistema de gestão operacional completo para eventos privados.</p>
      <p style="margin-top: 10px;">Dashboard em desenvolvimento. Funcionalidades CRM em breve.</p>
    </div>
  </div>
</body>
</html>
