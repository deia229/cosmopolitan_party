<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP Checklist Custos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f4f6;
      padding: 20px;
    }
    
    .header {
      background: linear-gradient(135deg, #ec4899, #db2777);
      color: white;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 24px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .card h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #1f2937;
    }
    
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #ec4899;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 Checklist Custos</h1>
    <p>Cosmopolitan Party - Offline iPad/Safari</p>
  </div>
  
  <div class="card">
    <h2>Dados do Evento</h2>
    <input type="text" placeholder="Nome do evento" id="nomeEvento">
    <select id="packEvento">
      <option value="">Selecionar pack...</option>
      <option value="so-espaco">Só Espaço (300€)</option>
      <option value="set-table">Set the Table (600€)</option>
      <option value="cosmo-classic">Cosmo Classic (920€)</option>
      <option value="easy-celebration">Easy Celebration (1050€)</option>
      <option value="cosmo-deluxe">Cosmo Deluxe (1130€)</option>
      <option value="cosmo-experience">Cosmo Experience (1280€)</option>
      <option value="the-cosmopolitan">The Cosmopolitan (1850€)</option>
    </select>
    <input type="number" placeholder="Número de convidados" id="numConvidados">
  </div>
  
  <div class="card">
    <h2>Estado</h2>
    <p>Ferramenta offline - Funcionalidade de cálculo em desenvolvimento</p>
  </div>
</body>
</html>
